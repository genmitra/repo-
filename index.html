
<!DOCTYPE html>
<html lang="en" class="transition duration-300">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genmitra - Public Services Help</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }
  </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition duration-300">
  <nav class="flex justify-between items-center px-6 py-4 shadow-md dark:bg-gray-800">
    <h1 class="text-2xl font-bold text-blue-700 dark:text-blue-400">Genmitra</h1>
    <div class="flex items-center gap-4">
      <button onclick="toggleDarkMode()" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 rounded-full">🌓</button>
      <a href="login.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700">Login</a>
    </div>
  </nav>
  <section class="text-center py-20 px-6 bg-gradient-to-br from-blue-100 to-blue-300 dark:from-gray-800 dark:to-gray-700 transition duration-500">
    <h2 class="text-5xl font-bold mb-4 animate-bounce">Welcome to Genmitra</h2>
    <p class="text-xl mb-6">Simplifying Government Services like EPF, PAN/Aadhaar, Tax & more</p>
    <a href="dashboard.html" class="inline-block bg-blue-700 text-white px-6 py-3 rounded-xl hover:bg-blue-800">Explore Services</a>
  </section>
  <footer class="bg-gray-900 text-gray-300 py-6 text-center">
    <p>© 2025 Genmitra. All rights reserved. Made with ❤️ in India.</p>
  </footer>
</body>
</html>
